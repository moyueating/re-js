<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, threeitial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
    #one{
      background: greenyellow;
      width: 300px;
      height: 300px;
    }
    #two{
      background: plum;
      width: 200px;
      height: 200px;
    }
    #three{
      background: palegoldenrod;
      width: 100px;
      height: 100px;
    }
  </style>
</head>
<body>
  <div id="one">
    <div id='two'>
      <div id="three"></div>
    </div>
  </div>

  <script>
    // addEventListener第三个参数还可以是一个对象options
    const one = document.getElementById('one')
    const two = document.getElementById('two')
    const three = document.getElementById('three')
    one.addEventListener('click', function(){
      console.log('捕获阶段')
    }, true)
    two.addEventListener('click', function(){
      console.log('冒泡阶段')
    }, false)

    three.addEventListener('click', function(){
      console.log(this)
      console.log('目标阶段')
    }, {
      capture: true,
      once: false,
      passive: false,
      mozSystemGroup: false
    })
  </script>
</body>
</html>
